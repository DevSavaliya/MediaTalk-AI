# Adapted from Streamlit's bundled shadcn theme; no external fonts required.
[theme]
base = "light"
primaryColor = "#147D64"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7F5"
textColor = "#192C25"
linkColor = "#147D64"
borderColor = "#DEE7E1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "8px"
font = "sans-serif"
baseFontSize = 15
headingFontSizes = ["40px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
greenColor = "#147D64"
greenBackgroundColor = "#E8F4ED"
greenTextColor = "#156149"

[theme.sidebar]
backgroundColor = "#F4F7F5"
secondaryBackgroundColor = "#EAF0EC"
textColor = "#192C25"
borderColor = "#DEE7E1"

[server]
fileWatcherType = "none"
address = "127.0.0.1"
maxUploadSize = 500
headless = true

[browser]
gatherUsageStats = false
